# NCQuickhacks - NPC compatibility
#
# A quickhack needs TWO registrations to reach the scanner wheel.  The program
# item's `objectActions` puts it on the *deck* side; this file puts it on the
# *target* side.  ScriptedPuppet.SendQuickhackCommands reads the NPC's own
# record - `this.GetRecord().ObjectActions(actionRecords)` - and
# TranslateChoicesIntoQuickSlotCommands then matches each installed program
# against that list by ActionName().  No match, no entry: the hack is silently
# dropped from the wheel even though the shard is installed in the cyberdeck.
#
# `!append-once` patches the vanilla record instead of replacing it, so this
# stays compatible with anything else that appends to the same NPC.
#
# To take a hack away from a group, delete or comment out its line.  To grant
# one, copy a `- !append-once QuickHack.NCQ_<Name>Hack` line across.  TweakXL
# only reads this at startup - restart the game fully after editing.

# <----------------------- NPC BASE RECORDS ----------------------->


