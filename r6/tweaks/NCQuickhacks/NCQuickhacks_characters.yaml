  objectActions:
    - !append-once QuickHack.NCQ_SmartLinkScrambleHack
    - !append-once QuickHack.NCQ_ReflexJammerHack
    - !append-once QuickHack.NCQ_OpticOverwriteHack
    - !append-once QuickHack.NCQ_PhantomOverlayHack
